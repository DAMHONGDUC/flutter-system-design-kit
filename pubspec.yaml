name: system_design
description: Shared design system — every generation in one import, for apps not yet on a generation package.
version: 0.1.0
publish_to: none

# The umbrella. Each generation is its own package under packages/ so an app
# depends on core plus the one generation it renders, and pays for no other
# generation's dependencies (WIDGET_RULES.md). This package re-exports them all
# for apps still importing `package:system_design/index.dart`.
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  system_design_core:
    path: packages/system_design_core
  system_design_v2:
    path: packages/system_design_v2
  system_design_v3:
    path: packages/system_design_v3
  system_design_v4:
    path: packages/system_design_v4
  system_design_v5:
    path: packages/system_design_v5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
