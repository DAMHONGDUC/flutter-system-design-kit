name: system_design_v5
description: Design system v5 — Tuku Shop's generation, with its router, bloc and media helpers.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  bloc: ^9.0.0
  chewie: ^1.13.0
  color_shade: ^1.0.1
  currency_formatter: ^2.2.3
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_skeleton_ui: ^0.0.6
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.3.0
  # A range, not a caret: v5's routes use only GoRoute, CustomTransitionPage and
  # pageKey, unchanged from 15 to 17, and the apps on v5 sit on both.
  go_router: ">=15.1.2 <18.0.0"
  intl: ^0.20.2
  logger: ^2.5.0
  # The icon font the generation draws, the same family the host app uses.
  material_symbols_icons: ^4.2960.0
  path_provider: ^2.1.5
  # The layer every generation shares; never another generation (WIDGET_RULES.md).
  system_design_core:
    path: ../system_design_core
  video_player: ^2.10.0
  video_thumbnail: ^0.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
